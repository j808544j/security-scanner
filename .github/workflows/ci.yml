name: Scan slice

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Verify API
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m ruff check .
          python -m pytest
      - name: Verify dashboard
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test
      - name: Build and start Compose services
        run: docker compose up --build --wait --wait-timeout 90
      - name: Verify Run scan in the browser
        run: |
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium
          python .github/smoke_scan.py
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop Compose services
        if: always()
        run: docker compose down -v
